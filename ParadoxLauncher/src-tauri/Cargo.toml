[package]
name = "launcher"
default-run = "launcher"
version = "0.1.16"
description = "Mystic Paradox launcher — sign in, verify your install, and play Dauntless"
authors = ["Mystic Paradox (pranav158)"]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/pranav158/Mystic-Paradox"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-window-state = "2.4.1"
keyring = "4.1.4"
url = "2.5.8"
sha2 = "0.11.0"
base64 = "0.22"
ed25519-dalek = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
dunce = "1.0.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-process = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"
